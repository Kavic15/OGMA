  <!-- Ogham side strokes -->
  <line x1="256" y1="180" x2="290" y2="180" stroke="black" stroke-width="8"/>
  <line x1="256" y1="210" x2="290" y2="210" stroke="black" stroke-width="8"/>
  <line x1="256" y1="300" x2="222" y2="300" stroke="black" stroke-width="8"/>
